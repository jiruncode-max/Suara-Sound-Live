<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Suara Sound Live</title>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800;900&family=JetBrains+Mono:wght@400;500;600;700&display=swap" rel="stylesheet">
  <style>
    *{margin:0;padding:0;box-sizing:border-box}
    :root{
      --bg:#f0f3f8;--card:#fff;--blue:#0d8aee;--red:#dc2626;--orange:#d97706;--yellow:#eab308;
      --text:#111827;--text2:#64748b;--border:#f1f5f9;
    }
    body{
      font-family:'Plus Jakarta Sans',sans-serif;background:var(--bg);color:var(--text);
      min-height:100vh;display:flex;align-items:center;justify-content:center;
      background-image:radial-gradient(circle at 20% 20%,rgba(13,138,238,.04) 0%,transparent 50%),radial-gradient(circle at 80% 80%,rgba(220,38,38,.03) 0%,transparent 50%)
    }
    .main{width:340px;display:flex;flex-direction:column;gap:10px}
    .card{background:var(--card);border:1px solid var(--border);border-radius:18px;padding:20px 22px;box-shadow:0 1px 2px rgba(0,0,0,.03),0 4px 16px rgba(0,0,0,.025);transition:box-shadow .25s}
    .card:hover{box-shadow:0 1px 2px rgba(0,0,0,.04),0 8px 28px rgba(0,0,0,.055)}
    .card-row{display:flex;align-items:center;gap:14px}

    /* Spasi pemisah antara TEROMPET dan grup MUSIK */
    .divider{display:flex;align-items:center;gap:12px;margin:8px 0}
    .divider::before,.divider::after{content:'';flex:1;height:1px;background:linear-gradient(90deg,transparent,#d7dfeb,transparent)}

    /* Spasi 2x lipat sebelum kartu jam (ubah 20px kalau mau lebih renggang) */
    .clock-card{margin-top:20px;padding:16px 14px}

    .ico{width:44px;height:44px;border-radius:13px;flex-shrink:0;display:flex;align-items:center;justify-content:center}
    .ico svg{width:20px;height:20px;fill:#fff}
    .ico.blue{background:linear-gradient(135deg,#0d8aee,#0a6fc2);box-shadow:0 3px 10px rgba(13,138,238,.25)}
    .ico.red{background:linear-gradient(135deg,#dc2626,#b91c1c);box-shadow:0 3px 10px rgba(220,38,38,.25)}
    .ico.orange{background:linear-gradient(135deg,#f59e0b,#d97706);box-shadow:0 3px 10px rgba(245,158,11,.25)}

    .ico.clickable{cursor:pointer;outline:none;transition:transform .15s,box-shadow .15s;-webkit-tap-highlight-color:transparent;position:relative;overflow:hidden}
    .ico.clickable:hover{transform:scale(1.08)}
    .ico.clickable:active{transform:scale(.92)}
    .ico.blue.clickable:hover{box-shadow:0 5px 16px rgba(13,138,238,.35)}
    .ico.blue.clickable:active{box-shadow:0 2px 6px rgba(13,138,238,.25)}
    .ico.red.clickable:hover{box-shadow:0 5px 16px rgba(220,38,38,.35)}
    .ico.red.clickable:active{box-shadow:0 2px 6px rgba(220,38,38,.25)}
    .ico.orange.clickable:hover{box-shadow:0 5px 16px rgba(245,158,11,.35)}
    .ico.orange.clickable:active{box-shadow:0 2px 6px rgba(245,158,11,.25)}

    .ico.clickable .rip{position:absolute;border-radius:50%;background:rgba(255,255,255,.35);transform:scale(0);animation:rip .5s ease-out forwards;pointer-events:none}
    @keyframes rip{to{transform:scale(3);opacity:0}}
    .ico.clickable.playing{animation:pulse 1.2s ease-in-out infinite}
    @keyframes pulse{0%,100%{box-shadow:0 3px 10px rgba(0,0,0,.2)}50%{box-shadow:0 3px 20px rgba(255,255,255,.25),0 0 0 6px rgba(255,255,255,.1)}}

    .info{flex:1;min-width:0}
    /* Label suara — semua hitam */
    .info-label{font-size:10px;font-weight:700;text-transform:uppercase;letter-spacing:.7px;margin-bottom:1px;color:#000}
    .info-sub{font-size:11px;color:var(--text2);margin-top:1px}

    /* ===== Jam WIB / WITA / WIT ===== */
    .clocks{display:flex;align-items:stretch}
    .clock-item{flex:1;text-align:center;padding:2px 4px}
    .clock-item+.clock-item{border-left:1px solid var(--border)}

    /* Ikon jam — gaya sama dengan ikon suara (kotak membulat, gradasi warna) */
    .tz-ico{width:42px;height:42px;border-radius:13px;margin:0 auto 7px;display:flex;align-items:center;justify-content:center}
    .tz-ico svg{width:23px;height:23px;display:block}
    .tz-ico.yellow{background:linear-gradient(135deg,#facc15,#eab308);box-shadow:0 3px 10px rgba(234,179,8,.25)}
    .tz-ico.blue{background:linear-gradient(135deg,#0d8aee,#0a6fc2);box-shadow:0 3px 10px rgba(13,138,238,.25)}
    .tz-ico.red{background:linear-gradient(135deg,#dc2626,#b91c1c);box-shadow:0 3px 10px rgba(220,38,38,.25)}
    /* Warna jarum jam = warna gelap dari gradasi kotaknya */
    .tz-ico.yellow path{stroke:#ca8a04}
    .tz-ico.blue path{stroke:#0a6fc2}
    .tz-ico.red path{stroke:#b91c1c}

    /* Label jam — hitam, dengan spasi lega ke angka di bawahnya (ubah 8px kalau mau lebih) */
    .tz-label{font-size:10px;font-weight:800;text-transform:uppercase;letter-spacing:1px;margin-bottom:8px;color:#000}
    .tz-time{font-family:'JetBrains Mono',monospace;font-size:14px;font-weight:700;color:var(--text);letter-spacing:.3px;font-variant-numeric:tabular-nums}

    @media(max-width:380px){.main{width:calc(100vw - 24px)}}
    @media(prefers-reduced-motion:reduce){*,*::before,*::after{animation-duration:.01ms!important;transition-duration:.01ms!important}}
  </style>
</head>
<body>

<audio id="sndTrumpet" src="https://e.top4top.io/m_3933s4xm91.mp4" preload="auto"></audio>
<audio id="sndMusik1" src="https://d.top4top.io/m_3935k602z0.mp4" preload="auto" loop></audio>
<audio id="sndMusik2" src="https://d.top4top.io/m_3935ya7sw0.mp4" preload="auto" loop></audio>

<div class="main">

  <!-- ===== TEROMPET (PALING ATAS) ===== -->
  <div class="card">
    <div class="card-row">
      <div class="ico orange clickable" id="playTrumpet" role="button" tabindex="0" aria-label="Putar suara Terompet">
        <svg viewBox="0 0 24 24">
          <rect x="2" y="11" width="13" height="2" rx="1"/>
          <path d="M14 11l8-5v12l-8-5v-2z"/>
          <rect x="6" y="8" width="1.6" height="3.5" rx=".8"/>
          <rect x="9" y="8" width="1.6" height="3.5" rx=".8"/>
          <rect x="12" y="8" width="1.6" height="3.5" rx=".8"/>
        </svg>
      </div>
      <div class="info">
        <div class="info-label">Suara TEROMPET</div>
        <div class="info-sub" id="subTrumpet">Tekan untuk memutar</div>
      </div>
    </div>
  </div>

  <!-- Spasi pemisah -->
  <div class="divider"></div>

  <!-- ===== MUSIK 1 (LOOP TANPA HENTI) ===== -->
  <div class="card">
    <div class="card-row">
      <div class="ico blue clickable" id="playMusik1" role="button" tabindex="0" aria-label="Putar Musik 1 berulang tanpa henti">
        <svg viewBox="0 0 24 24"><path d="M12 3v10.55c-.59-.34-1.27-.55-2-.55C7.79 13 6 14.79 6 17s1.79 4 4 4 4-1.79 4-4V7h4V3h-6z"/></svg>
      </div>
      <div class="info">
        <div class="info-label">MUSIK 1</div>
        <div class="info-sub" id="subMusik1">Tekan untuk memutar (berulang)</div>
      </div>
    </div>
  </div>

  <!-- ===== MUSIK 2 (LOOP TANPA HENTI) — ikon sama dgn Musik 1, beda warna ===== -->
  <div class="card">
    <div class="card-row">
      <div class="ico red clickable" id="playMusik2" role="button" tabindex="0" aria-label="Putar Musik 2 berulang tanpa henti">
        <svg viewBox="0 0 24 24"><path d="M12 3v10.55c-.59-.34-1.27-.55-2-.55C7.79 13 6 14.79 6 17s1.79 4 4 4 4-1.79 4-4V7h4V3h-6z"/></svg>
      </div>
      <div class="info">
        <div class="info-label">MUSIK 2</div>
        <div class="info-sub" id="subMusik2">Tekan untuk memutar (berulang)</div>
      </div>
    </div>
  </div>

  <!-- ===== JAM WIB / WITA / WIT (spasi 2x di atasnya) ===== -->
  <div class="card clock-card">
    <div class="clocks">
      <div class="clock-item">
        <div class="tz-ico yellow">
          <svg viewBox="0 0 24 24">
            <circle cx="12" cy="12" r="10" fill="#fff"/>
            <path fill="none" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" d="M12 6.8V12l3.6 2.1"/>
          </svg>
        </div>
        <div class="tz-label">JAM WIB</div>
        <div class="tz-time" id="jamWib">--:--:--</div>
      </div>
      <div class="clock-item">
        <div class="tz-ico blue">
          <svg viewBox="0 0 24 24">
            <circle cx="12" cy="12" r="10" fill="#fff"/>
            <path fill="none" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" d="M12 6.8V12l3.6 2.1"/>
          </svg>
        </div>
        <div class="tz-label">JAM WITA</div>
        <div class="tz-time" id="jamWita">--:--:--</div>
      </div>
      <div class="clock-item">
        <div class="tz-ico red">
          <svg viewBox="0 0 24 24">
            <circle cx="12" cy="12" r="10" fill="#fff"/>
            <path fill="none" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" d="M12 6.8V12l3.6 2.1"/>
          </svg>
        </div>
        <div class="tz-label">JAM WIT</div>
        <div class="tz-time" id="jamWit">--:--:--</div>
      </div>
    </div>
  </div>

</div>

<script>
(function(){

  /* ====== PENGATURAN SUARA (3 ANGKA INI YANG BISA DIUBAH-UBAH) ====== */

  /* Kencangnya TEROMPET */
  var BOOST=3;

  /* Kencangnya MUSIK. 1.4 = kencang tapi tetap bersih, karena puncaknya
     ditahan limiter (tidak pernah pecah). Kurang kencang? Naikkan (mis. 1.7).
     Kelewatan? Turunkan (mis. 1.2). */
  var MUSIC_BOOST=1.4;

  /* Seberapa kecil MUSIK saat terompet berbunyi:
     0.5 = setengah volume (agak kecil, masih jelas kedengaran)
     0.3 = kecil banget | 1 = tidak mereda sama sekali.
     Musik otomatis balik penuh begitu terompet selesai/dimatikan. */
  var DUCK=0.5;

  var actx=null, limiter=null;
  var players=[];
  var trumpetPlaying=false;
  var primed=false;

  function ensureCtx(){
    if(actx) return;
    var AC=window.AudioContext||window.webkitAudioContext;
    if(!AC) return;
    actx=new AC();
    /* Limiter "brickwall": puncak suara dijaga agar kencang tapi tidak pecah */
    limiter=actx.createDynamicsCompressor();
    limiter.threshold.value=-2;
    limiter.knee.value=0;
    limiter.ratio.value=20;
    limiter.attack.value=.002;
    limiter.release.value=.25;
    limiter.connect(actx.destination);
  }

  function decode(ab){
    return new Promise(function(res,rej){
      try{ actx.decodeAudioData(ab,res,rej); }catch(e){ rej(e); }
    });
  }

  /* ====== PRELOAD 3 LAPIS (BIAR Nggak DELAY) ======
     1. File di-download jadi BLOB begitu halaman dibuka.
     2. Elemen audio langsung ditukar ke blob LOKAL — jalur cadangan pun
        tidak buffering internet lagi saat ditekan.
     3. Blob di-decode jadi AudioBuffer di RAM — jalur utama, start instan total. */
  function preload(p){
    ensureCtx();
    if(!window.fetch) return;
    fetch(p.a.currentSrc||p.a.src)
      .then(function(r){ if(!r.ok) throw 0; return r.blob(); })
      .then(function(blob){
        p.blobURL=URL.createObjectURL(blob);
        if(p.a.paused && p.a.dataset.boost!=='1'){
          try{ p.a.src=p.blobURL; p.a.dataset.boost='1'; p.a.load(); }catch(e){}
        }
        return blob.arrayBuffer();
      })
      .then(function(ab){ return decode(ab); })
      .then(function(buf){ p.buf=buf; })
      .catch(function(){ /* gagal/CORS → tetap jalan lewat elemen */ });
  }

  /* ====== PUTAR INSTAN DARI MEMORI (RAM) ====== */
  function startBuf(p){
    stopBuf(p);
    var src=actx.createBufferSource();
    src.buffer=p.buf;
    src.loop=!p.isTrumpet;                 /* musik = loop tanpa henti */
    if(!p.g) p.g=actx.createGain();
    var mul=(p.isMusic&&trumpetPlaying)?DUCK:1;
    var t=actx.currentTime;
    p.g.gain.cancelScheduledValues(t);
    p.g.gain.setValueAtTime((p.isTrumpet?BOOST:MUSIC_BOOST)*mul,t);
    src.connect(p.g);
    p.g.connect(limiter);
    var tok={stopped:false};
    p.cur={src:src,g:p.g,tok:tok};
    src.onended=function(){
      if(tok.stopped) return;              /* dihentikan user → abaikan */
      p.cur=null;
      setUI(p,false);
      if(p.isTrumpet){ trumpetPlaying=false; applyDuck(); }
    };
    src.start(0);                          /* ← bunyi SESAAT ini juga */
  }

  function stopBuf(p){
    if(!p.cur) return;
    p.cur.tok.stopped=true;
    try{p.cur.src.onended=null;}catch(e){}
    try{p.cur.src.stop();}catch(e){}
    try{p.cur.src.disconnect();}catch(e){}
    p.cur=null;
  }

  /* Stop apa pun jalurnya (memori / elemen) */
  function stopPlayer(p){
    if(p.cur){ stopBuf(p); return; }
    if(!p.a.paused){
      p.a.pause();
      try{p.a.currentTime=0;}catch(err){}
    }
  }

  /* ====== PRIME PIPELINE AUDIO (ANTI DELAY DI HP/IPHONE) ======
     Saat sentuhan pertama di mana pun, tiap audio di-"play senyap" sesaat
     lalu dihentikan, supaya tekanan pertama tidak terasa telat. */
  function primeElement(a){
    if(a.dataset.primed) return;
    a.dataset.primed='1';
    a.muted=true;
    var pr=null;
    try{ pr=a.play(); }catch(e){ a.muted=false; return; }
    if(pr&&pr.then){
      pr.then(function(){
        a.pause(); a.muted=false;
        try{a.currentTime=0;}catch(e){}
      }).catch(function(){ a.muted=false; });
    }else{
      a.pause(); a.muted=false;
      try{a.currentTime=0;}catch(e){}
    }
  }

  /* ====== RIPPLE ====== */
  function addRip(btn,e){
    var r=document.createElement('span');
    r.className='rip';
    var rect=btn.getBoundingClientRect();
    var size=Math.max(rect.width,rect.height);
    r.style.width=r.style.height=size+'px';
    var x=(e&&typeof e.clientX==='number')?e.clientX-rect.left-size/2:0;
    var y=(e&&typeof e.clientY==='number')?e.clientY-rect.top-size/2:0;
    r.style.left=x+'px';
    r.style.top=y+'px';
    btn.appendChild(r);
    r.addEventListener('animationend',function(){r.remove();});
  }

  /* ====== UI STATUS ====== */
  function setUI(p,on){
    if(on){
      p.btn.classList.add('playing');
      p.sub.textContent = p.isTrumpet
        ? 'Sedang memutar...'
        : (trumpetPlaying ? 'Berputar (mereda)... tekan untuk berhenti' : 'Berputar terus... tekan untuk berhenti');
    }else{
      p.btn.classList.remove('playing');
      p.sub.textContent = p.isTrumpet ? 'Tekan untuk memutar' : 'Tekan untuk memutar (berulang)';
    }
  }

  /* Musik mereda saat terompet bunyi — ramp halus (tanpa "klik"),
     dan PASTI balik normal saat terompet selesai/dimatikan */
  function applyDuck(){
    players.forEach(function(o){
      if(!o.isMusic) return;
      var mul=trumpetPlaying?DUCK:1;
      if(o.cur&&actx){
        var t=actx.currentTime;
        o.cur.g.gain.cancelScheduledValues(t);
        o.cur.g.gain.setTargetAtTime(MUSIC_BOOST*mul,t,.06);
      }
      o.a.volume=mul;
      if(o.cur||!o.a.paused) setUI(o,true);
    });
  }

  /* ====== LOGIKA PEMUTAR ====== */
  function setupPlayer(aid,bid,sid,opts){
    var a=document.getElementById(aid),
        b=document.getElementById(bid),
        s=document.getElementById(sid);

    var p={a:a,btn:b,sub:s,isTrumpet:!!opts.trumpet,isMusic:!!opts.music,
           buf:null,blobURL:null,cur:null,g:null};
    a.volume=1;
    players.push(p);

    preload(p);   /* ← unduh + decode MULAI SEKARANG, jangan nunggu ditekan */

    a.addEventListener('error',function(){
      if(a.paused) setUI(p,false);
    });

    /* FIX PENTING: kalau putaran lewat jalur cadangan (elemen) berakhir
       sendiri (terompet selesai), matikan UI & KEMBALIKAN volume musik
       yang tadi mereda. Dulu bug-nya di sini: musik tetap kecil terus. */
    a.addEventListener('ended',function(){
      if(p.cur) return;                  /* jalur memori sudah punya handler sendiri */
      setUI(p,false);
      if(p.isTrumpet){ trumpetPlaying=false; applyDuck(); }
    });

    function play(e){
      if(e) addRip(b,e);

      ensureCtx();
      if(actx&&actx.state==='suspended') actx.resume();

      /* Tekan lagi saat bunyi → berhenti (langsung, tanpa delay) */
      if(p.cur || !p.a.paused){
        stopPlayer(p);
        if(p.isTrumpet) trumpetPlaying=false;
        setUI(p,false);
        applyDuck();
        return;
      }

      /* Musik menyalakan → matikan musik lain.
         Terompet TIDAK mematikan musik, musik TIDAK mematikan terompet. */
      if(p.isMusic){
        players.forEach(function(o){
          if(o===p||o.isTrumpet) return;
          stopPlayer(o);
          setUI(o,false);
        });
      }

      if(p.isTrumpet) trumpetPlaying=true;

      if(p.buf&&actx){
        /* JALUR 1 (INSTAN TOTAL): dari RAM, tanpa jaringan */
        startBuf(p);
        setUI(p,true);
      }else{
        /* JALUR 2 (HAMPIR INSTAN): elemen audio (sumber sudah blob lokal) */
        if(p.blobURL && p.a.dataset.boost!=='1'){
          try{ p.a.src=p.blobURL; p.a.dataset.boost='1'; p.a.load(); }catch(e2){}
        }
        p.a.volume=(p.isMusic&&trumpetPlaying)?DUCK:1;
        try{a.currentTime=0;}catch(err){}
        setUI(p,true);
        var pr=a.play();
        if(pr&&pr.catch){
          pr.catch(function(){ if(a.paused) setUI(p,false); });
        }
      }

      applyDuck();
    }

    b.addEventListener('click',play);
    b.addEventListener('keydown',function(e){
      if(e.key===' '||e.key==='Enter'){e.preventDefault();play(null);}
    });
  }

  /* Inisialisasi Pemutar Suara */
  setupPlayer('sndTrumpet','playTrumpet','subTrumpet',{trumpet:true});
  setupPlayer('sndMusik1','playMusik1','subMusik1',{music:true});
  setupPlayer('sndMusik2','playMusik2','subMusik2',{music:true});

  /* Sentuhan pertama di mana pun → resume audio + prime semua pipeline */
  document.addEventListener('pointerdown',function(e){
    ensureCtx();
    if(actx&&actx.state==='suspended') actx.resume();
    if(primed) return;
    primed=true;
    players.forEach(function(o){
      if(o.cur||!o.a.paused) return;
      if(e.target&&o.btn.contains(e.target)) return;
      primeElement(o.a);
    });
  },{passive:true});

  /* ====== JAM WIB / WITA / WIT ====== */
  function fmt(tz){
    return new Intl.DateTimeFormat('en-GB',{
      timeZone:tz,hour:'2-digit',minute:'2-digit',second:'2-digit',hour12:false
    }).format(new Date());
  }
  function tick(){
    var w=document.getElementById('jamWib'),
        c=document.getElementById('jamWita'),
        i=document.getElementById('jamWit');
    if(w) w.textContent=fmt('Asia/Jakarta');   /* WIB  = UTC+7 */
    if(c) c.textContent=fmt('Asia/Makassar');  /* WITA = UTC+8 */
    if(i) i.textContent=fmt('Asia/Jayapura');  /* WIT  = UTC+9 */
  }
  setInterval(tick,1000);
  tick();

})();
</script>
</body>
</html>
