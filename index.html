<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Suara Sound Live</title>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800;900&family=JetBrains+Mono:wght@400;500;600;700&display=swap" rel="stylesheet">
  <style>
    *{margin:0;padding:0;box-sizing:border-box}
    :root{
      --bg:#f0f3f8;--card:#fff;--blue:#0d8aee;--red:#dc2626;--orange:#d97706;--yellow:#eab308;
      --text:#111827;--text2:#64748b;--border:#f1f5f9;
    }
    body{
      font-family:'Plus Jakarta Sans',sans-serif;background:var(--bg);color:var(--text);
      min-height:100vh;display:flex;align-items:center;justify-content:center;
      background-image:radial-gradient(circle at 20% 20%,rgba(13,138,238,.04) 0%,transparent 50%),radial-gradient(circle at 80% 80%,rgba(220,38,38,.03) 0%,transparent 50%)
    }
    .main{width:340px;display:flex;flex-direction:column;gap:10px}
    .card{background:var(--card);border:1px solid var(--border);border-radius:18px;padding:20px 22px;box-shadow:0 1px 2px rgba(0,0,0,.03),0 4px 16px rgba(0,0,0,.025);transition:box-shadow .25s}
    .card:hover{box-shadow:0 1px 2px rgba(0,0,0,.04),0 8px 28px rgba(0,0,0,.055)}
    .card-row{display:flex;align-items:center;gap:14px}

    /* Spasi pemisah antara TEROMPET dan grup DANA/BRIMO */
    .divider{display:flex;align-items:center;gap:12px;margin:8px 0}
    .divider::before,.divider::after{content:'';flex:1;height:1px;background:linear-gradient(90deg,transparent,#d7dfeb,transparent)}

    /* Spasi 2x lipat sebelum kartu jam (ubah 20px kalau mau lebih renggang) */
    .clock-card{margin-top:20px;padding:16px 14px}

    .ico{width:44px;height:44px;border-radius:13px;flex-shrink:0;display:flex;align-items:center;justify-content:center}
    .ico svg{width:20px;height:20px;fill:#fff}
    .ico.blue{background:linear-gradient(135deg,#0d8aee,#0a6fc2);box-shadow:0 3px 10px rgba(13,138,238,.25)}
    .ico.red{background:linear-gradient(135deg,#dc2626,#b91c1c);box-shadow:0 3px 10px rgba(220,38,38,.25)}
    .ico.orange{background:linear-gradient(135deg,#f59e0b,#d97706);box-shadow:0 3px 10px rgba(245,158,11,.25)}

    .ico.clickable{cursor:pointer;outline:none;transition:transform .15s,box-shadow .15s;-webkit-tap-highlight-color:transparent;position:relative;overflow:hidden}
    .ico.clickable:hover{transform:scale(1.08)}
    .ico.clickable:active{transform:scale(.92)}
    .ico.blue.clickable:hover{box-shadow:0 5px 16px rgba(13,138,238,.35)}
    .ico.blue.clickable:active{box-shadow:0 2px 6px rgba(13,138,238,.25)}
    .ico.red.clickable:hover{box-shadow:0 5px 16px rgba(220,38,38,.35)}
    .ico.red.clickable:active{box-shadow:0 2px 6px rgba(220,38,38,.25)}
    .ico.orange.clickable:hover{box-shadow:0 5px 16px rgba(245,158,11,.35)}
    .ico.orange.clickable:active{box-shadow:0 2px 6px rgba(245,158,11,.25)}

    .ico.clickable .rip{position:absolute;border-radius:50%;background:rgba(255,255,255,.35);transform:scale(0);animation:rip .5s ease-out forwards;pointer-events:none}
    @keyframes rip{to{transform:scale(3);opacity:0}}
    .ico.clickable.playing{animation:pulse 1.2s ease-in-out infinite}
    @keyframes pulse{0%,100%{box-shadow:0 3px 10px rgba(0,0,0,.2)}50%{box-shadow:0 3px 20px rgba(255,255,255,.25),0 0 0 6px rgba(255,255,255,.1)}}

    .info{flex:1;min-width:0}
    /* Label suara — semua hitam */
    .info-label{font-size:10px;font-weight:700;text-transform:uppercase;letter-spacing:.7px;margin-bottom:1px;color:#000}
    .info-sub{font-size:11px;color:var(--text2);margin-top:1px}

    /* ===== Jam WIB / WITA / WIT ===== */
    .clocks{display:flex;align-items:stretch}
    .clock-item{flex:1;text-align:center;padding:2px 4px}
    .clock-item+.clock-item{border-left:1px solid var(--border)}

    /* Ikon jam — gaya sama dengan ikon suara (kotak membulat, gradasi warna) */
    .tz-ico{width:42px;height:42px;border-radius:13px;margin:0 auto 7px;display:flex;align-items:center;justify-content:center}
    .tz-ico svg{width:23px;height:23px;display:block}
    .tz-ico.yellow{background:linear-gradient(135deg,#facc15,#eab308);box-shadow:0 3px 10px rgba(234,179,8,.25)}
    .tz-ico.blue{background:linear-gradient(135deg,#0d8aee,#0a6fc2);box-shadow:0 3px 10px rgba(13,138,238,.25)}
    .tz-ico.red{background:linear-gradient(135deg,#dc2626,#b91c1c);box-shadow:0 3px 10px rgba(220,38,38,.25)}
    /* Warna jarum jam = warna gelap dari gradasi kotaknya */
    .tz-ico.yellow path{stroke:#ca8a04}
    .tz-ico.blue path{stroke:#0a6fc2}
    .tz-ico.red path{stroke:#b91c1c}

    /* Label jam — hitam, dengan spasi lega ke angka di bawahnya (ubah 8px kalau mau lebih) */
    .tz-label{font-size:10px;font-weight:800;text-transform:uppercase;letter-spacing:1px;margin-bottom:8px;color:#000}
    .tz-time{font-family:'JetBrains Mono',monospace;font-size:14px;font-weight:700;color:var(--text);letter-spacing:.3px;font-variant-numeric:tabular-nums}

    @media(max-width:380px){.main{width:calc(100vw - 24px)}}
    @media(prefers-reduced-motion:reduce){*,*::before,*::after{animation-duration:.01ms!important;transition-duration:.01ms!important}}
  </style>
</head>
<body>

<audio id="sndTrumpet" src="https://e.top4top.io/m_3933s4xm91.mp4" preload="auto"></audio>
<audio id="sndDana" src="https://f.top4top.io/m_3866kd13c1.mp4" preload="auto"></audio>
<audio id="sndBrimo" src="https://d.top4top.io/m_38946vda11.mp3" preload="auto"></audio>

<div class="main">

  <!-- ===== TEROMPET (PALING ATAS) ===== -->
  <div class="card">
    <div class="card-row">
      <div class="ico orange clickable" id="playTrumpet" role="button" tabindex="0" aria-label="Putar suara Terompet">
        <svg viewBox="0 0 24 24">
          <rect x="2" y="11" width="13" height="2" rx="1"/>
          <path d="M14 11l8-5v12l-8-5v-2z"/>
          <rect x="6" y="8" width="1.6" height="3.5" rx=".8"/>
          <rect x="9" y="8" width="1.6" height="3.5" rx=".8"/>
          <rect x="12" y="8" width="1.6" height="3.5" rx=".8"/>
        </svg>
      </div>
      <div class="info">
        <div class="info-label">Suara TEROMPET</div>
        <div class="info-sub" id="subTrumpet">Tekan untuk memutar</div>
      </div>
    </div>
  </div>

  <!-- Spasi pemisah -->
  <div class="divider"></div>

  <!-- ===== DANA ===== -->
  <div class="card">
    <div class="card-row">
      <div class="ico blue clickable" id="playDana" role="button" tabindex="0" aria-label="Putar suara DANA">
        <svg viewBox="0 0 24 24"><path d="M3 9v6h4l5 5V4L7 9H3zm13.5 3A4.5 4.5 0 0014 8.5v7a4.49 4.49 0 002.5-3.5zM14 3.23v2.06a7.007 7.007 0 010 13.42v2.06A9.014 9.014 0 0014 3.23z"/></svg>
      </div>
      <div class="info">
        <div class="info-label">Suara DANA</div>
        <div class="info-sub" id="subDana">Tekan untuk memutar</div>
      </div>
    </div>
  </div>

  <!-- ===== BRIMO ===== -->
  <div class="card">
    <div class="card-row">
      <div class="ico red clickable" id="playBrimo" role="button" tabindex="0" aria-label="Putar suara BRIMO">
        <svg viewBox="0 0 24 24"><path d="M12 3v10.55c-.59-.34-1.27-.55-2-.55C7.79 13 6 14.79 6 17s1.79 4 4 4 4-1.79 4-4V7h4V3h-6zM10 19c-1.1 0-2-.9-2-2s.9-2 2-2 2 .9 2 2-.9 2-2 2z"/></svg>
      </div>
      <div class="info">
        <div class="info-label">Suara BRIMO</div>
        <div class="info-sub" id="subBrimo">Tekan untuk memutar</div>
      </div>
    </div>
  </div>

  <!-- ===== JAM WIB / WITA / WIT (spasi 2x di atasnya) ===== -->
  <div class="card clock-card">
    <div class="clocks">
      <div class="clock-item">
        <div class="tz-ico yellow">
          <svg viewBox="0 0 24 24">
            <circle cx="12" cy="12" r="10" fill="#fff"/>
            <path fill="none" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" d="M12 6.8V12l3.6 2.1"/>
          </svg>
        </div>
        <div class="tz-label">JAM WIB</div>
        <div class="tz-time" id="jamWib">--:--:--</div>
      </div>
      <div class="clock-item">
        <div class="tz-ico blue">
          <svg viewBox="0 0 24 24">
            <circle cx="12" cy="12" r="10" fill="#fff"/>
            <path fill="none" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" d="M12 6.8V12l3.6 2.1"/>
          </svg>
        </div>
        <div class="tz-label">JAM WITA</div>
        <div class="tz-time" id="jamWita">--:--:--</div>
      </div>
      <div class="clock-item">
        <div class="tz-ico red">
          <svg viewBox="0 0 24 24">
            <circle cx="12" cy="12" r="10" fill="#fff"/>
            <path fill="none" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" d="M12 6.8V12l3.6 2.1"/>
          </svg>
        </div>
        <div class="tz-label">JAM WIT</div>
        <div class="tz-time" id="jamWit">--:--:--</div>
      </div>
    </div>
  </div>

</div>

<script>
(function(){

  /* ====== PENGUAT SUARA ======
     Ubah angka ini kalau kurang kencang (1 = normal, 3 = kencang) */
  var BOOST=3;

  var actx=null, boostIn=null;

  function ensureCtx(){
    if(actx) return;
    var AC=window.AudioContext||window.webkitAudioContext;
    if(!AC) return;
    actx=new AC();
    var g=actx.createGain();
    g.gain.value=BOOST;
    /* Compressor supaya suara kencang tapi tidak pecah */
    var comp=actx.createDynamicsCompressor();
    comp.threshold.value=-18; comp.knee.value=20; comp.ratio.value=6;
    comp.attack.value=.003; comp.release.value=.25;
    g.connect(comp); comp.connect(actx.destination);
    boostIn=g;
  }

  /* File di-download jadi blob (supaya boleh diproses Web Audio),
     lalu di-rute lewat GainNode agar volumenya bisa di atas 100% */
  function tryBoost(a){
    if(!window.fetch) return;
    fetch(a.currentSrc||a.src)
      .then(function(r){ if(!r.ok) throw 0; return r.blob(); })
      .then(function(blob){
        var apply=function(){
          try{
            ensureCtx();
            if(!actx) return;
            a.src=URL.createObjectURL(blob);
            a.load();
            var s=actx.createMediaElementSource(a);
            s.connect(boostIn);
          }catch(e){}
        };
        if(a.paused) apply();
        else a.addEventListener('ended',apply,{once:true});
      })
      .catch(function(){ /* CORS diblokir → suara tetap jalan normal */ });
  }

  /* === Ripple Effect === */
  function addRip(btn,e){
    var r=document.createElement('span');
    r.className='rip';
    var rect=btn.getBoundingClientRect();
    var size=Math.max(rect.width,rect.height);
    r.style.width=r.style.height=size+'px';
    r.style.left=(e.clientX-rect.left-size/2)+'px';
    r.style.top=(e.clientY-rect.top-size/2)+'px';
    btn.appendChild(r);
    r.addEventListener('animationend',function(){r.remove();});
  }

  /* === Audio Player Logic === */
  function setupPlayer(aid,bid,sid){
    var a=document.getElementById(aid),
        b=document.getElementById(bid),
        s=document.getElementById(sid);

    a.volume=1;
    tryBoost(a);

    function play(e){
      if(e) addRip(b,e);

      ensureCtx();
      if(actx&&actx.state==='suspended') actx.resume();

      /* Stop audio lain yang sedang berjalan */
      document.querySelectorAll('audio').forEach(function(el){
        if(el!==a){el.pause();el.currentTime=0;}
      });

      /* Hapus animasi playing dari tombol lain */
      document.querySelectorAll('.ico.clickable').forEach(function(el){
        el.classList.remove('playing');
      });

      try{a.currentTime=0;}catch(err){}
      var p=a.play();

      if(p&&p.then){
        p.then(function(){
          b.classList.add('playing');
          s.textContent='Sedang memutar...';
        }).catch(function(){
          s.textContent='Tekan untuk memutar';
        });
      }
    }

    a.addEventListener('ended',function(){
      b.classList.remove('playing');
      s.textContent='Tekan untuk memutar';
    });

    b.addEventListener('click',play);
    b.addEventListener('keydown',function(e){
      if(e.key===' '||e.key==='Enter'){e.preventDefault();play(null);}
    });
  }

  /* Inisialisasi Pemutar Suara */
  setupPlayer('sndTrumpet','playTrumpet','subTrumpet');
  setupPlayer('sndDana','playDana','subDana');
  setupPlayer('sndBrimo','playBrimo','subBrimo');

  /* ====== JAM WIB / WITA / WIT ====== */
  function fmt(tz){
    return new Intl.DateTimeFormat('en-GB',{
      timeZone:tz,hour:'2-digit',minute:'2-digit',second:'2-digit',hour12:false
    }).format(new Date());
  }
  function tick(){
    var w=document.getElementById('jamWib'),
        c=document.getElementById('jamWita'),
        i=document.getElementById('jamWit');
    if(w) w.textContent=fmt('Asia/Jakarta');   /* WIB  = UTC+7 */
    if(c) c.textContent=fmt('Asia/Makassar');  /* WITA = UTC+8 */
    if(i) i.textContent=fmt('Asia/Jayapura');  /* WIT  = UTC+9 */
  }
  setInterval(tick,1000);
  tick();

})();
</script>
</body>
</html>
